
<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="referrer" content="no-referrer">

  <title>GCI QR Scanner V3.5</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    main {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 10px;
    }

    button, a {
      display: inline-block;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      cursor: pointer;
      margin: 5px;
      font-size: 14px;
    }

    button:disabled {
      opacity: .5;
    }

    #reader {
      width: 100%;
      margin: 16px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      border-radius: 12px;
    }

    #result {
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    #version {
      color: #64748b;
      font-size: 12px;
    }

    #back {
      background: #64748b;
    }

    #detail {
      background: #16a34a;
    }

    [hidden] {
      display: none !important;
    }

  </style>

</head>

<body>

<main>

  <h2>GCI Inventory Scanner</h2>

  <p>Asset Tracking &amp; Audit Control</p>

  <div id="version">
    Auto Scanner V3.5
  </div>

  <button id="start" hidden>
    Aktifkan Kamera
  </button>

  <button id="stop" hidden disabled>
    Stop Kamera
  </button>

  <div id="reader"></div>

  <p id="result" role="status">
    Menyiapkan kamera otomatis...
  </p>

  <a id="detail" hidden>
    Buka Detail Aset
  </a>

  <a id="back">
    Kembali ke Inventory
  </a>

</main>

<script>

/* ==========================================
   URL INVENTORY TERBARU
========================================== */

const INVENTORY_URL =
  "https://script.google.com/macros/s/AKfycbx4rjYcR9NCMBP_3UWJM1xVC_LhEyVhRgGp8l3IY60yCaDYVirsaPNe8ldzGcsKLfPC7g/exec";


/* ==========================================
   ELEMENT
========================================== */

const start =
  document.getElementById('start');

const stop =
  document.getElementById('stop');

const result =
  document.getElementById('result');

const back =
  document.getElementById('back');

const detail =
  document.getElementById('detail');

let scanner = null;

let busy = false;

let running = false;

let detected = false;


/* ==========================================
   VALIDASI URL INVENTORY
========================================== */

function validInventoryUrl(value) {

  try {

    const url = new URL(value);

    return (

      url.origin ===
      'https://script.google.com' &&

      url.href ===
      new URL(INVENTORY_URL).href

    );

  } catch(error) {

    return false;

  }

}


/* ==========================================
   AMBIL URL INVENTORY
========================================== */

function getInventoryUrl() {

  const hash = new URLSearchParams(
    location.hash.slice(1)
  );

  const query = new URLSearchParams(
    location.search
  );

  const incoming =

    hash.get('return') ||

    query.get('return');

  if(incoming && validInventoryUrl(incoming)) {

    return new URL(incoming);

  }

  return new URL(INVENTORY_URL);

}


const returnUrl = getInventoryUrl();

back.href = returnUrl.href;


/* ==========================================
   STOP KAMERA
========================================== */

async function stopCamera() {

  try {

    if(scanner && running) {

      await scanner.stop();

      running = false;

    }

  } finally {

    stop.disabled = true;

    stop.hidden = true;

    start.disabled = false;

    start.hidden = false;

  }

}


/* ==========================================
   HASIL SCAN
========================================== */

async function finishScan(code) {

  code = String(code || '').trim();

  if(!code) {

    detected = false;

    return;

  }

  result.textContent =
    'Kode Aset: ' + code;

  try {

    await stopCamera();

  } catch(error) {

    console.error(error);

  }

  start.hidden = true;

  result.textContent =
    'Aset terbaca. Membuka detail aset...';

  const target = new URL(returnUrl.href);

  target.searchParams.set(
    'asset',
    code
  );

  target.searchParams.set(
    '_t',
    String(Date.now())
  );

  detail.href = target.href;

  detail.hidden = false;

  location.replace(target.href);

}


/* ==========================================
   START KAMERA OTOMATIS
========================================== */

async function startCamera() {

  if(busy || running) return;

  busy = true;

  detected = false;

  detail.hidden = true;

  start.disabled = true;

  start.hidden = true;

  result.textContent =
    'Membuka kamera...';

  let pending = null;

  try {

    if(!scanner) {

      scanner = new Html5Qrcode('reader');

    }

    await scanner.start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: function(width,height) {

          const size = Math.min(
            250,
            Math.floor(
              Math.min(width,height) * 0.75
            )
          );

          return {

            width: size,

            height: size

          };

        }

      },

      function(code) {

        if(detected) return;

        detected = true;

        if(!running) {

          pending = code;

          return;

        }

        finishScan(code);

      },

      function() {}

    );

    running = true;

    stop.disabled = false;

    stop.hidden = false;

    if(pending !== null) {

      await finishScan(pending);

    } else if(!detected) {

      result.textContent =
        'Arahkan kamera ke QR Code aset.';

    }

  } catch(error) {

    result.textContent =

      'Kamera tidak dapat dibuka otomatis. ' +

      'Tekan Aktifkan Kamera untuk mencoba lagi.';

    console.error(error);

    start.disabled = false;

    start.hidden = false;

  } finally {

    busy = false;

  }

}


/* ==========================================
   TOMBOL KAMERA
========================================== */

start.onclick = startCamera;

stop.onclick = async function() {

  if(busy) return;

  try {

    await stopCamera();

    detected = false;

    result.textContent =
      'Kamera dihentikan.';

  } catch(error) {

    result.textContent =
      String(error);

  }

};


/* ==========================================
   KEMBALI KE INVENTORY
========================================== */

back.onclick = function(event) {

  event.preventDefault();

  const target = new URL(returnUrl.href);

  target.searchParams.set(
    '_t',
    String(Date.now())
  );

  location.replace(target.href);

};


/* ==========================================
   AUTO START
========================================== */

if(document.readyState === 'loading') {

  document.addEventListener(

    'DOMContentLoaded',

    startCamera,

    {once:true}

  );

} else {

  startCamera();

}


/* ==========================================
   RESET HALAMAN CACHE
========================================== */

window.addEventListener(
  'pageshow',
  function(event) {

    if(event.persisted) {

      location.reload();

    }

  }
);

</script>

</body>

</html>
