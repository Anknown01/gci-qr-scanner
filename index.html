
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
  content="width=device-width,initial-scale=1">

<meta name="referrer"
  content="no-referrer">

<title>Greenchem Inventory Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#193b27;
  padding:20px;
}

main {
  max-width:490px;
  margin:20px auto;
  background:white;
  border:1px solid #dfe9df;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 12px 35px #173e2410;
}

.header {
  background:linear-gradient(135deg,#073b24,#176334);
  padding:25px;
  text-align:center;
  color:white;
  border-bottom:4px solid #a9d34c;
}

.logo-box {
  width:135px;
  background:white;
  border-radius:12px;
  padding:8px;
  margin:0 auto 15px;
}

.logo-box img {
  width:100%;
  height:80px;
  object-fit:contain;
}

.header h2 {
  margin:0 0 7px;
  font-size:21px;
}

.header p {
  margin:0;
  color:#e0eee1;
  font-size:12px;
}

.version {
  display:inline-block;
  margin-top:12px;
  padding:6px 12px;
  border:1px solid #ffffff35;
  border-radius:30px;
  font-size:11px;
}

.content {
  padding:22px;
  text-align:center;
}

.scanner-title {
  font-size:18px;
  font-weight:700;
  margin-bottom:8px;
}

#camera-status {
  font-size:12px;
  font-weight:600;
  color:#176334;
  background:#e9f3e5;
  padding:8px 12px;
  border-radius:30px;
  display:inline-block;
  margin:5px 0;
}

#reader {
  width:100%;
  margin:18px auto;
  border-radius:14px;
  overflow:hidden;
}

#reader video {
  border-radius:14px;
}

#result {
  font-size:14px;
  color:#53695a;
  line-height:1.6;
  overflow-wrap:anywhere;
}

button,a {
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  border:0;
  border-radius:10px;
  padding:13px 17px;
  cursor:pointer;
  text-decoration:none;
}

#start {
  width:100%;
  background:#176334;
  color:white;
}

#stop {
  background:#edf3ec;
  color:#176334;
  width:100%;
  margin-bottom:12px;
}

#back {
  display:block;
  width:100%;
  border:1px solid #176334;
  color:#176334;
  background:white;
  margin-top:10px;
}

#detail {
  display:block;
  width:100%;
  background:#176334;
  color:white;
  margin:10px 0;
}

.footer {
  border-top:1px solid #e8eee7;
  color:#748477;
  font-size:11px;
  text-align:center;
  padding:15px;
}

[hidden] {
  display:none!important;
}

button:disabled {
  opacity:.5;
}

@media(max-width:600px) {

  body {
    padding:10px;
  }

  main {
    margin:0 auto;
    border-radius:16px;
  }

  .header {
    padding:20px;
  }

  .content {
    padding:16px;
  }

}

</style>

</head>

<body>

<main>

  <header class="header">

    <div class="logo-box">
      <img src="./logo-greenchem.png"
        alt="Greenchem"
        onerror="this.parentElement.hidden=true">
    </div>

    <h2>Greenchem Inventory Scanner</h2>

    <p>Asset Tracking & Audit Control</p>

    <div class="version">
      V4.0 Enterprise
    </div>

  </header>

  <section class="content">

    <div class="scanner-title">
      <i class="bi bi-qr-code-scan"></i>
      Scan QR Aset
    </div>

    <div id="camera-status">
      Menyiapkan kamera
    </div>

    <div id="reader"></div>

    <p id="result" role="status">
      Kamera akan menyala otomatis.
    </p>

    <button id="start" hidden>
      <i class="bi bi-camera-video"></i>
      Aktifkan Kamera
    </button>

    <button id="stop" hidden>
      <i class="bi bi-stop-circle"></i>
      Stop Kamera
    </button>

    <a id="detail" hidden>
      Buka Detail Aset
    </a>

    <a id="back">
      <i class="bi bi-arrow-left"></i>
      Kembali ke Inventory
    </a>

  </section>

  <footer class="footer">
    PT Green Chemicals Indonesia
    <br>
    Developed by IT Department
  </footer>

</main>

<script>

const INVENTORY_URL =
  'https://script.google.com/macros/s/AKfycbx4rjYcR9NCMBP_3UWJM1xVC_LhEyVhRgGp8l3IY60yCaDYVirsaPNe8ldzGcsKLfPC7g/exec';

const start = document.getElementById('start');
const stop = document.getElementById('stop');
const result = document.getElementById('result');
const back = document.getElementById('back');
const detail = document.getElementById('detail');
const status = document.getElementById('camera-status');

let scanner = null;
let busy = false;
let running = false;
let detected = false;
let finishing = false;
let leaving = false;


/* VALIDASI URL KEMBALI */

function getInventoryUrl() {

  const hash = new URLSearchParams(
    location.hash.slice(1)
  );

  const query = new URLSearchParams(
    location.search
  );

  const incoming =
    hash.get('return') ||
    query.get('return');

  try {

    const url = new URL(
      incoming || INVENTORY_URL
    );

    if(url.href === new URL(INVENTORY_URL).href) {

      return url;

    }

  } catch(error) {

    console.error(error);

  }

  return new URL(INVENTORY_URL);

}

const returnUrl = getInventoryUrl();

back.href = returnUrl.href;


/* STOP CAMERA */

async function stopCamera() {

  if(scanner && running) {

    await scanner.stop();

    running = false;

  }

  stop.hidden = true;

  start.hidden = false;
  start.disabled = false;

}


/* HASIL QR */

async function finishScan(code) {

  if(finishing || leaving) return;

  code = String(code || '').trim();

  if(!code) {

    detected = false;
    return;

  }

  finishing = true;

  status.textContent = 'QR berhasil terbaca';

  result.textContent =
    'Membuka detail aset: '+code;

  try {

    await stopCamera();

  } catch(error) {

    console.error(error);

  }

  if(leaving) return;

  start.hidden = true;
  stop.hidden = true;

  const target = new URL(returnUrl.href);

  target.searchParams.set('asset',code);

  target.searchParams.set(
    '_t',
    String(Date.now())
  );

  detail.href = target.href;

  detail.hidden = false;

  location.replace(target.href);

}


/* AUTO START CAMERA */

async function startCamera() {

  if(busy || running || finishing || leaving) {

    return;

  }

  busy = true;

  detected = false;

  start.disabled = true;
  start.hidden = true;
  detail.hidden = true;

  status.textContent = 'Membuka kamera...';

  result.textContent =
    'Mohon izinkan akses kamera jika diminta.';

  let pending = null;

  try {

    if(!scanner) {

      scanner = new Html5Qrcode('reader');

    }

    await scanner.start(

      {
        facingMode:'environment'
      },

      {
        fps:10,

        qrbox:function(width,height) {

          const size = Math.min(
            280,
            Math.floor(
              Math.min(width,height)*.75
            )
          );

          return {
            width:size,
            height:size
          };

        }

      },

      function(code) {

        if(detected || leaving) return;

        detected = true;

        if(!running) {

          pending = code;

          return;

        }

        finishScan(code);

      },

      function() {}

    );

    running = true;

    if(leaving) {

      await stopCamera();
      return;

    }

    stop.hidden = false;

    status.textContent = 'Kamera aktif';

    result.textContent =
      'Arahkan kamera ke QR Code aset.';

    if(pending !== null) {

      await finishScan(pending);

    }

  } catch(error) {

    status.textContent =
      'Kamera belum aktif';

    result.textContent =
      'Kamera belum dapat dibuka otomatis. '+
      'Tekan Aktifkan Kamera untuk mencoba lagi.';

    console.error(error);

    start.hidden = false;
    start.disabled = false;

  } finally {

    busy = false;

  }

}


/* CAMERA BUTTON */

start.onclick = startCamera;

stop.onclick = async function() {

  if(busy || finishing) return;

  busy = true;

  try {

    await stopCamera();

    detected = false;

    status.textContent =
      'Kamera dihentikan';

    result.textContent =
      'Tekan Aktifkan Kamera untuk scan kembali.';

  } catch(error) {

    result.textContent =
      String(error);

  } finally {

    busy = false;

  }

};


/* BACK BUTTON */

back.onclick = function(event) {

  event.preventDefault();

  leaving = true;

  const target = new URL(returnUrl.href);

  target.searchParams.set(
    '_t',
    String(Date.now())
  );

  location.replace(target.href);

};


/* INITIAL START */

if(document.readyState === 'loading') {

  document.addEventListener(
    'DOMContentLoaded',
    startCamera,
    {once:true}
  );

} else {

  startCamera();

}


/* RESET CACHED PAGE */

window.addEventListener(
  'pageshow',
  function(event) {

    if(event.persisted) {

      location.reload();

    }

  }
);

</script>

</body>
</html>
